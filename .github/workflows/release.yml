name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx wrangler deploy --dry-run --outdir dist
      - name: Package build
        run: tar -czf "alfred-${GITHUB_REF_NAME}.tar.gz" dist public wrangler.jsonc LICENSE
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "alfred-${GITHUB_REF_NAME}.tar.gz" --generate-notes --title "$GITHUB_REF_NAME"
      # Deploys only when the CLOUDFLARE_API_TOKEN repository secret exists.
      # Set TEAM_DOMAIN, POLICY_AUD and TEAM_MEMBERS first, or the API rejects every request.
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "No CLOUDFLARE_API_TOKEN secret; skipping deploy."; exit 0; fi
          npx wrangler deploy
